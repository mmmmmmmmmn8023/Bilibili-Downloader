name: Deploy to Server

on:
  push:
    branches:
      - develop/feature        # 只有 push 到这个分支才触发
  workflow_dispatch:           # 也支持在 Actions 页面手动点 Run

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH 连服务器并部署
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: bash /var/www/deploy-bilibili.sh
