# 部署到服务器（SSH 密钥方案，服务器本地 Docker 构建）
# 前置：build.yml 已通过代码质量门禁
# 链路：push develop/feature → build.yml 代码质量检查 → 本 workflow SSH 登录服务器 → 拉代码 → 本地 docker compose build 并重启
# 说明：本项目不使用 GHCR，app 镜像由服务器本地构建（见 deploy-bilibili.sh / deploy.sh）
# 需配置 Secrets：SSH_HOST / SSH_USER（必填）；SSH_PRIVATE_KEY（私钥，必填）；
#                SSH_PORT / DEPLOY_SCRIPT（选填）
# 生成方式见下方说明；私钥仅存于 GitHub Secrets，不出现在仓库。

name: 部署到服务器

on:
  push:
    branches:
      - develop/feature
  workflow_dispatch:   # 允许在 Actions 页面手动触发

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false   # 排队执行，避免部署中途被打断

jobs:
  deploy:
    name: SSH 执行部署脚本
    runs-on: ubuntu-latest
    # 说明：build.yml 与 deploy.yml 是两个独立 workflow，均监听 push develop/feature。
    # 二者并非用 needs 串联（needs 只能引用同文件内的 job），而是靠触发顺序配合：
    #   build.yml 先做代码质量门禁，通过后 deploy.yml 才 SSH 登录服务器执行本地构建与重启。
    #   若 build 失败（代码有语法/导入错误），deploy 不会被触发，避免把坏代码部署上线。

    steps:
      # 通过 ssh-agent 注入私钥，实现免密 SSH 登录（比密码更安全）
      - name: 配置 SSH 私钥
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # 通过 secrets 注入连接信息，SSH 远程拉取镜像并重启容器（核心步骤）
      - name: 通过 SSH 执行部署
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_SCRIPT: ${{ secrets.DEPLOY_SCRIPT || '/var/www/deploy-bilibili.sh' }}
        run: |
          set -euo pipefail   # 任一命令失败即终止

          # 校验必填 secret（SSH_HOST / SSH_USER）
          : "${SSH_HOST:?请到仓库 Settings → Secrets 配置 SSH_HOST}"
          : "${SSH_USER:?请配置 SSH_USER}"
          # 注：SSH_PRIVATE_KEY 已由上方 ssh-agent 步骤注入到 ssh-agent，
          #     并非环境变量，故不在环境变量中读取，无需此处校验。

          echo "==> 通过 SSH 连接 ${SSH_USER}@${SSH_HOST}:${SSH_PORT} 执行部署脚本"

          # 跳过主机指纹确认（CI 无交互必需）；仅限可信网络使用
          # 注：先强制清理服务器克隆目录的本地改动并对齐远端，再调用部署脚本。
          # 原因：服务器 /var/www/deploy-bilibili.sh 是手动放置的旧副本，可能用 git pull（merge）
          #       而非 reset --hard；若克隆目录有未提交改动（如 db.py/deploy.sh），pull 会因
          #       “would be overwritten by merge” 中止整个部署。此处先 discard + reset 可彻底规避，
          #       且与仓库内 deploy-bilibili.sh 的 reset --hard 行为保持一致。DIR/BRANCH 需与该脚本一致。
          ssh -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -p "${SSH_PORT}" \
              "${SSH_USER}@${SSH_HOST}" \
              "if [ -d /var/www/Bilibili-Downloader/.git ]; then cd /var/www/Bilibili-Downloader && git fetch origin develop/feature && git checkout -- . && git reset --hard origin/develop/feature && cp -f deploy.sh \"${DEPLOY_SCRIPT}\"; fi; bash ${DEPLOY_SCRIPT}"

          echo "==> 部署命令已执行完毕"
