# 代码质量门禁（不构建/推送镜像）
# 流程：push develop/feature → 代码质量校验（语法 + 导入检查）→ 通过后放行 deploy.yml 部署
# 仅当本工作流成功，deploy.yml（needs: build）才会 SSH 到服务器部署
#
# 说明：本项目暂无单元测试，这里用"代码质量门禁"替代——
#   - py_compile 语法检查：拦截语法错误
#   - 导入检查：确认依赖可正常 import（Docker 镜像内已装好依赖）
#   后续可补 pytest 用例，本文件加一步 pytest 即可。

name: 代码质量检查

on:
  push:
    branches:
      - develop/feature
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: 代码质量门禁
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v6

      # 代码质量门禁：语法 + 导入检查（用官方 Python 镜像，环境与运行一致）
      # 说明：本项目不再使用 GHCR，app 镜像由服务器本地 docker compose build 构建（见 deploy-bilibili.sh）
      #       此处仅做代码质量校验，拦截语法错误 / 依赖导入失败，再放行 deploy.yml 部署
      - name: 代码质量检查
        uses: docker://python:3.13-slim
        with:
          entrypoint: /bin/bash
          args: -c "pip install --no-cache-dir curl_cffi qrcode Pillow && python -m py_compile server.py bilibili.py && python -c 'import server, bilibili; print(\"导入检查通过\")'"
