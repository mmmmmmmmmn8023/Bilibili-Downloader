# 生产部署编排（公网 + 域名 + 鉴权）
# 拓扑：浏览器 → Caddy(443 HTTPS 反代) → app(仅内部 8000, 应用内账号鉴权) → 持久化卷
#
# 用法：
#   1. cp .env.example .env        # 填 DOMAIN / ADMIN_EMAIL（可选 ADMIN_USER / ADMIN_PASSWORD 指定管理员）
#   2. chmod +x deploy.sh && ./deploy.sh
#
# 说明：
#   - app 镜像由服务器本地 docker compose build 构建（不再使用 GHCR），
#     见 deploy-bilibili.sh / deploy.sh 中的 up -d --build
#   - app 仅 expose 8000（内部网络），不映射公网端口
#   - 公网只经 Caddy 的 80(证书验证) / 443(HTTPS) 暴露
#   - Web 界面鉴权由应用内自建账号体系负责（Caddy 仅做 HTTPS 反代）

services:
  app:
    # 服务器本地构建（Dockerfile 在仓库根目录），不使用 GHCR
    build:
      context: .
      dockerfile: Dockerfile
    image: bilibili-downloader:latest
    container_name: bilibili-downloader
    environment:
      - PORT=8000
      # 必须监听所有网卡，否则同网络内 Caddy 反代 app:8000 会 connection refused
      - BIND_HOST=0.0.0.0
      # 管理员账号引导（来自 .env；留空则不自动创建管理员）
      - ADMIN_USER=${ADMIN_USER}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    # 仅内部暴露，绝不映射公网端口
    expose:
      - "8000"
    volumes:
      - ./downloads:/app/downloads
      - ./config.json:/app/config.json
      - ./bili_history.db:/app/bili_history.db
      - ./logs:/app/logs
    # 健康检查：TCP 探测 8000，确认服务已监听再放行流量
    healthcheck:
      test: ["CMD", "python", "-c", "import socket,sys; s=socket.socket(); sys.exit(0) if s.connect_ex(('127.0.0.1', 8000))==0 else sys.exit(1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    # 资源限制：避免批量下载吃光内存/CPU 把宿主机拖垮
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.5"
        reservations:
          memory: 256m
          cpus: "0.25"
    restart: unless-stopped
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    container_name: bilibili-caddy
    ports:
      - "80:80"     # 仅用于 ACME 证书申请 / 续期验证
      - "443:443"   # 公网 HTTPS 入口
      - "8888:8888" # 备用入口：域名:8888 直接访问
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data      # 证书存储（切勿删除，否则需重新申请）
      - caddy_config:/config
    # 等 app 通过健康检查后再启动，避免 Caddy 代理到未就绪服务
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
