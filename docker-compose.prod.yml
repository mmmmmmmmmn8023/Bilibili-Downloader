# 生产部署编排（公网 + 域名 + 鉴权）
# 拓扑：浏览器 → Caddy(443 + Basic Auth) → app(仅内部 8000) → 持久化卷
#
# 用法：
#   1. cp .env.example .env        # 填 DOMAIN / AUTH_USER / AUTH_PASS / ADMIN_EMAIL
#   2. chmod +x deploy.sh && ./deploy.sh
#
# 说明：
#   - app 镜像由 GitHub Actions (build.yml) 云端构建并推送到 GHCR，
#     本机只需 docker pull 拉取，无需在服务器上 build（见 deploy-bilibili.sh）
#   - app 仅 expose 8000（内部网络），不映射公网端口
#   - 公网只经 Caddy 的 80(证书验证) / 443(HTTPS) 暴露
#   - Web 界面无内置登录，全靠 Caddy 的 Basic Auth 作公网唯一防线

services:
  app:
    # 使用 GHCR 上由 build.yml 推送的预构建镜像（仓库名自动转小写）
    image: ghcr.io/mmmmmmmmmn8023/bilibili-downloader:latest
    container_name: bilibili-downloader
    environment:
      - PORT=8000
      # 必须监听所有网卡，否则同网络内 Caddy 反代 app:8000 会 connection refused
      - BIND_HOST=0.0.0.0
    # 仅内部暴露，绝不映射公网端口
    expose:
      - "8000"
    volumes:
      - ./downloads:/app/downloads
      - ./config.json:/app/config.json
      - ./download_history.json:/app/download_history.json
      - ./logs:/app/logs
    # 健康检查：TCP 探测 8000，确认服务已监听再放行流量
    healthcheck:
      test: ["CMD", "python", "-c", "import socket,sys; s=socket.socket(); sys.exit(0) if s.connect_ex(('127.0.0.1', 8000))==0 else sys.exit(1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    # 资源限制：避免批量下载吃光内存/CPU 把宿主机拖垮
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.5"
        reservations:
          memory: 256m
          cpus: "0.25"
    restart: unless-stopped
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    container_name: bilibili-caddy
    ports:
      - "80:80"     # 仅用于 ACME 证书申请 / 续期验证
      - "443:443"   # 公网 HTTPS 入口
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data      # 证书存储（切勿删除，否则需重新申请）
      - caddy_config:/config
    # 等 app 通过健康检查后再启动，避免 Caddy 代理到未就绪服务
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
